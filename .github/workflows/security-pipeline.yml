name: Security CI Pipeline

on:
  push:
    branches: ["main", "test-*"]
  pull_request:
    branches: ["main"]

jobs:
  security-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare reports directory
        run: mkdir -p reports && chmod 777 reports

      - name: Install application and security dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt bandit semgrep pip-audit

      - name: Run unit tests
        run: pytest tests/test_app.py -v

      - name: Run AI security tests
        run: pytest tests/test_ai_security.py -v

      - name: Run Bandit SAST
        continue-on-error: true
        run: bandit -r app/ -f json -o reports/bandit-report.json

      - name: Run Semgrep SAST
        continue-on-error: true
        run: |
          semgrep scan \
            --config security/semgrep/rules.yml \
            --metrics=off \
            --json \
            --output reports/semgrep-report.json \
            app/

      - name: Run pip-audit dependency scan
        continue-on-error: true
        run: pip-audit -r requirements.txt -f json -o reports/dependency-report.json

      - name: Build Docker image and run Trivy scan
        continue-on-error: true
        run: |
          docker build -t vulnfinbot:latest .
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${{ github.workspace }}/reports:/reports" \
            aquasec/trivy:latest image \
            --format json \
            --output /reports/trivy-report.json \
            vulnfinbot:latest

      - name: Run OWASP ZAP Baseline Scan
        continue-on-error: true
        run: |
          docker run -d --name vulnfinbot-dast -p 5000:5000 vulnfinbot:latest
          sleep 4
          curl -fsS http://localhost:5000/health
          docker run --rm --network host \
            -v "${{ github.workspace }}/reports:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://localhost:5000 \
            -J zap-report.json

      - name: Stop DAST container
        if: always()
        run: docker rm -f vulnfinbot-dast || true

      - name: Upload all security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vulnfinbot-security-reports
          path: reports/
          retention-days: 30
          if-no-files-found: warn
